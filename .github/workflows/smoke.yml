# SPDX-License-Identifier: MIT
name: Package tests
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      matrix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Package ${{ matrix.test_kind }} test (${{ matrix.id }}, ${{ matrix.k8s_distro }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.channel }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
      - name: Resolve the matching upstream Kubernetes CI revision
        id: upstream-ci
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          revision = json.loads(Path('out/build-request.json').read_text())['source_revision']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          Path('smoke-results').mkdir(exist_ok=True)
          Path('smoke-results/upstream-ci-revision.txt').write_text(revision + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kata-containers/kata-containers
          ref: ${{ steps.upstream-ci.outputs.revision }}
          path: upstream-kata
          persist-credentials: false
          sparse-checkout: |
            tests
            ci
            tools/packaging/guest-image
      - name: Prepare kcli and libvirt on this hosted runner
        if: matrix.execution == 'vm'
        run: bash scripts/prepare-smoke-runner.sh
      - name: Prepare the disposable Ubuntu runner for Kubernetes
        if: matrix.execution == 'direct' && matrix.test_kind == 'workload'
        run: |
          mkdir -p smoke-results
          { cat /etc/os-release; uname -a; lscpu; } > smoke-results/runner-host.txt
          sudo systemctl disable --now docker.service docker.socket containerd.service || true
          if dpkg-query -W -f='${db:Status-Status}' containerd.io 2>/dev/null | grep -qx installed; then
            sudo apt-get remove -y containerd.io
          fi
          sudo modprobe kvm
          if grep -qw vmx /proc/cpuinfo; then sudo modprobe kvm_intel; fi
          if grep -qw svm /proc/cpuinfo; then sudo modprobe kvm_amd; fi
          ls -l /dev/kvm >> smoke-results/runner-host.txt
      - name: Download packages from the exact successful OBS source revision
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          OBS_API_URL: ${{ vars.OBS_API_URL || 'https://api.opensuse.org' }}
          SMOKE_TARGET: ${{ matrix.id }}
        run: >-
          python3 scripts/smoke.py download
          --request out/build-request.json --receipt out/obs-build.json
          --target "$SMOKE_TARGET" --output packages
      - name: Create one VM and run normal and debug smoke pods
        if: matrix.execution == 'vm'
        env:
          SMOKE_TARGET: ${{ matrix.id }}
          K8S_DISTRO: ${{ matrix.k8s_distro }}
        run: python3 scripts/smoke_vm.py run --target "$SMOKE_TARGET" --k8s-distro "$K8S_DISTRO"
      - name: Install Kubernetes and packages directly on the runner and run both smoke pods
        if: matrix.execution == 'direct' && matrix.test_kind == 'workload'
        env:
          SMOKE_TARGET: ${{ matrix.id }}
          K8S_DISTRO: ${{ matrix.k8s_distro }}
          KATA_PROFILE: ${{ matrix.profile }}
        run: >-
          sudo -n python3 scripts/smoke.py run --disposable
          --k8s-distro "$K8S_DISTRO" --profile "$KATA_PROFILE" --target "$SMOKE_TARGET"
          --request out/build-request.json --receipt out/obs-build.json
          --packages packages --output smoke-results
      - name: Validate GPU package installation without starting a guest or GPU workload
        if: matrix.execution == 'direct' && matrix.test_kind == 'installation'
        env:
          KATA_PROFILE: ${{ matrix.profile }}
        run: |
          sudo systemctl disable --now docker.service docker.socket containerd.service || true
          if dpkg-query -W -f='${db:Status-Status}' containerd.io 2>/dev/null | grep -qx installed; then
            sudo apt-get remove -y containerd.io
          fi
          sudo -n python3 scripts/smoke.py install-containerd --output smoke-results
          sudo apt-get install -y dpkg-dev cryptsetup-bin kmod
          sudo -n python3 scripts/validate.py packages --profile "$KATA_PROFILE" --install --fresh
          sudo -n python3 scripts/validate.py packages --profile qemu --install
      - name: Exercise the TEE snapshotter proxy without starting a guest
        if: matrix.profile == 'nvidia-gpu-tee'
        run: |
          sudo systemctl daemon-reload
          sudo systemctl start nydus-for-kata-tee.service
          sudo systemctl restart containerd.service
          sudo timeout 60 bash -c 'until ctr --namespace k8s.io snapshots --snapshotter nydus-for-kata-tee ls; do sleep 2; done'
          sudo systemctl is-active nydus-for-kata-tee.service
      - name: Capture the TEE snapshotter and containerd journals
        if: always() && matrix.profile == 'nvidia-gpu-tee'
        run: |
          mkdir -p smoke-results
          sudo journalctl -b -u nydus-for-kata-tee -u containerd --no-pager > smoke-results/nydus-containerd.log
      - name: Capture the direct runner kernel journal
        if: always() && matrix.execution == 'direct'
        run: |
          mkdir -p smoke-results
          sudo journalctl -k -b --no-pager > smoke-results/host-kernel.log
      - name: Ensure the job's VM is destroyed
        if: always() && matrix.execution == 'vm'
        run: python3 scripts/smoke_vm.py cleanup
      - name: Make diagnostics readable
        if: always()
        run: |
          if [ -d smoke-results ]; then
            sudo -n chown -R "$(id -u):$(id -g)" smoke-results
          fi
      - name: Keep smoke results and package identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.channel }}-smoke-${{ matrix.id }}-${{ matrix.k8s_distro }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            smoke-results/
            packages/SHA256SUMS
            packages/validation*.json
            packages/setup-*.txt
            packages/setup-*.diff
          retention-days: 14
